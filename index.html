<script>
  var SUPABASE_URL = "https://xrushybvdckfvlbhhfld.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhydXNoeWJ2ZGNrZnZsYmhoZmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzE2NTgsImV4cCI6MjEwNTQ0NzY1OH0.3MVw5sjZPbM_VUU-QQulFgT84ODk1TPQN-oqPKdiQ68";

  // Supabase(다른 회사 서버)를 두 개의 CDN에서 순서대로 시도해서 불러온다 —
  // 한쪽이 막혀 있어도 다른 쪽으로 연결되게 하기 위해서다.
  window.__dbReady = (function(){
    function loadScript(src){
      return new Promise(function(resolve, reject){
        var s = document.createElement("script");
        s.src = src;
        s.onload = function(){ resolve(); };
        s.onerror = function(){ reject(new Error("load failed: "+src)); };
        document.head.appendChild(s);
      });
    }
    var sources = [
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
      "https://unpkg.com/@supabase/supabase-js@2"
    ];
    function tryLoad(i){
      if(i >= sources.length) return Promise.reject(new Error("모든 경로에서 Supabase를 불러오지 못했습니다"));
      return loadScript(sources[i])
        .then(function(){ return makeSupabaseDb(); })
        .catch(function(err){ console.error(err); return tryLoad(i+1); });
    }

    // 우리 앱이 기대하는 모양(doc().get/set/onSnapshot, collection().where().get/onSnapshot)으로
    // Supabase의 kv_store 테이블을 감싸는 어댑터
    function makeSupabaseDb(){
      var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var TABLE = "kv_store";

      function snapFromRow(row){
        var exists = !!row;
        var value = exists ? row.value : undefined;
        return { exists: exists, data: function(){ return value; } };
      }

      function docRef(path){
        function get(){
          return client.from(TABLE).select("value").eq("key", path).maybeSingle()
            .then(function(res){
              if(res.error) throw res.error;
              return snapFromRow(res.data);
            });
        }
        return {
          get: get,
          set: function(obj){
            return client.from(TABLE)
              .upsert({ key: path, value: obj, updated_at: new Date().toISOString() }, { onConflict: "key" })
              .then(function(res){ if(res.error) throw res.error; });
          },
          delete: function(){
            return client.from(TABLE).delete().eq("key", path)
              .then(function(res){ if(res.error) throw res.error; });
          },
          onSnapshot: function(cb, errCb){
            get().then(cb).catch(function(e){ if(errCb) errCb(e); });
            var channel = client.channel("doc:"+path)
              .on("postgres_changes",
                { event: "*", schema: "public", table: TABLE, filter: "key=eq."+path },
                function(){ get().then(cb).catch(function(e){ if(errCb) errCb(e); }); })
              .subscribe();
            return function unsub(){ client.removeChannel(channel); };
          }
        };
      }

      function collectionRef(basePath){
        return {
          doc: function(id){ return docRef(basePath + "/" + id); },
          where: function(field, op, val){
            var prefix = basePath + "/" + val + "_";
            function fetchDocs(){
              return client.from(TABLE).select("key,value").like("key", prefix+"%")
                .then(function(res){
                  if(res.error) throw res.error;
                  var docs = (res.data||[]).map(function(row){
                    return { id: row.key, data: function(){ return row.value; } };
                  });
                  return { docs: docs };
                });
            }
            return {
              get: fetchDocs,
              onSnapshot: function(cb, errCb){
                fetchDocs().then(cb).catch(function(e){ if(errCb) errCb(e); });
                var channel = client.channel("col:"+basePath+":"+val)
                  .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, function(payload){
                    var k = (payload.new && payload.new.key) || (payload.old && payload.old.key);
                    if(k && k.indexOf(prefix) === 0){
                      fetchDocs().then(cb).catch(function(e){ if(errCb) errCb(e); });
                    }
                  })
                  .subscribe();
                return function unsub(){ client.removeChannel(channel); };
              }
            };
          }
        };
      }

      function wipeAll(){
        return client.from(TABLE).delete().neq("key", "__never_matches__");
      }
      return { doc: docRef, collection: collectionRef, wipeAll: wipeAll };
    }

    return tryLoad(0);
  })();
</script>
<style>
  :root{
    --bg:#FAFAF7; --surface:#FFFFFF; --ink:#1F2A22; --muted:#7C8878;
    --rule:#ECEAE2; --rule-strong:#D8D5C8;
    --accent:#4DB848; --accent-soft:#E5F5E3; --accent-ink:#FFFFFF; --accent-text:#2A2A2C;
    --feature:#F68B1E; --feature-soft:#FDECD8; --feature-ink:#FFFFFF;
    --danger:#B23A2A; --sun:#B0483A; --sat:#3A6E8C;
    --shadow:0 1px 3px rgba(31,42,34,.08);
    --shadow-lg:0 4px 14px rgba(31,42,34,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151815; --surface:#20241F; --ink:#EDEEE9; --muted:#9CA89C;
      --rule:#2E332C; --rule-strong:#414841;
      --accent:#6BCB67; --accent-soft:#1E3320; --accent-ink:#0E1A0E; --accent-text:#EDEEE9;
      --feature:#FFA64D; --feature-soft:#3A2A12; --feature-ink:#2B1400;
      --danger:#E0806D; --sun:#E08A7C; --sat:#8FB2DC;
      --shadow:0 1px 3px rgba(0,0,0,.35);
      --shadow-lg:0 4px 14px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151815; --surface:#20241F; --ink:#EDEEE9; --muted:#9CA89C;
    --rule:#2E332C; --rule-strong:#414841;
    --accent:#6BCB67; --accent-soft:#1E3320; --accent-ink:#0E1A0E; --accent-text:#EDEEE9;
    --feature:#FFA64D; --feature-soft:#3A2A12; --feature-ink:#2B1400;
    --danger:#E0806D; --sun:#E08A7C; --sat:#8FB2DC;
    --shadow:0 1px 3px rgba(0,0,0,.35); --shadow-lg:0 4px 14px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  *{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  .noticebody,.commenttext,.posttitle,.commentname,.commentdate,.noticedate{-webkit-user-select:text;user-select:text}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:17.5px; line-height:1.55; -webkit-text-size-adjust:100%;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:960px;margin:0 auto;padding:26px 16px 90px}
  h1,h2,h3{font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}

  /* ---- top bar ---- */
  .bar{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .homebadge{
    width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .bar h1{font-size:25.5px;line-height:1.2}
  .back{
    flex:none;border:none;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
    border-radius:10px;width:34px;height:34px;font:inherit;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .back:hover{color:var(--accent)}
  .bar .sub{margin-left:auto;color:var(--muted);font-size:15.5px;white-space:nowrap}
  input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ---- home ---- */
  .lede{color:var(--muted);font-size:16.5px;margin:16px 0 22px;max-width:56ch}
  .menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .tile{
    display:block;text-align:left;width:100%;cursor:pointer;
    background:var(--surface);box-shadow:var(--shadow);border-left:3px solid var(--accent);
    border-radius:14px;padding:20px 20px 17px;font:inherit;color:inherit;
  }
  .tile:hover{border-color:var(--rule-strong);border-left-color:var(--accent)}
  .tile.featured{
    border-left-width:4px;border-left-color:var(--feature);
    background:var(--feature-soft);
  }
  .tile.featured:hover{border-left-color:var(--feature)}
  .tile.featured .t{font-size:21.5px}
  .tile .t{font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:20.5px;display:block}

  .posttag{
    box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
    flex:none;font-size:14px;font-weight:700;line-height:1.3;
    border-radius:999px;padding:3px 11px;border:1px solid transparent;white-space:nowrap;
  }
  .posttag.notice{color:var(--feature-ink);background:var(--feature);border-color:var(--feature)}
  .posttag.free{color:var(--muted);background:var(--surface);border-color:var(--rule-strong)}
  .boardtabs{display:flex;gap:6px;margin:16px 0 12px}
  .boardtab{
    font:inherit;font-size:15px;cursor:pointer;background:var(--surface);color:var(--muted);
    border:1px solid var(--rule-strong);border-radius:999px;padding:6px 15px;
  }
  .boardtab:hover{border-color:var(--ink)}
  .boardtab.tab-all.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .boardtab.tab-notice.on{background:var(--feature);color:var(--feature-ink);border-color:var(--feature)}
  .boardtab.tab-free.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .boardpager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
  .pagerlabel{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
  .writewrap{display:flex;justify-content:flex-end;margin-top:12px}
  .postactions{margin-left:auto;display:flex;gap:6px;flex-wrap:nowrap}
  .actionbtn{
    font:inherit;font-size:14px;cursor:pointer;background:var(--surface);color:var(--ink);
    border:1px solid var(--rule-strong);border-radius:999px;padding:4px 11px;white-space:nowrap;
  }
  .actionbtn:hover{border-color:var(--ink)}
  .actionbtn.danger{color:var(--danger);border-color:var(--danger)}
  .actionbtn.on{background:var(--feature);color:var(--feature-ink);border-color:var(--feature)}
  .noticelive{font-size:13.5px;color:var(--muted);align-self:center}
  .commentlist{display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
  .commentactions{margin-left:auto;display:flex;gap:6px}
  .commentrow{padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .commentrow:last-child{border-bottom:none;padding-bottom:0}
  .commenttop{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .commentname{font-weight:500;font-size:15px}
  .commentdate{font-size:13.5px;color:var(--muted)}
  .commenttext{font-size:15.5px;line-height:1.6;white-space:pre-wrap}
  .noticecard{
    display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow);
    border-radius:14px;margin:18px 0 20px;overflow:hidden;
  }
  .noticestriprow{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
    background:none;border:none;border-bottom:1px solid var(--rule);
    padding:13px 16px;font:inherit;color:var(--ink);
  }
  .noticestriprow:last-child{border-bottom:none}
  .noticestriprow:hover{background:var(--accent-soft)}
  .noticestripicon{flex:none;display:flex;color:var(--feature)}
  .noticestriplabel{font-size:13px;font-weight:700;color:var(--feature)}
  .noticestriptitle{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noticestripchev{margin-left:auto;font-size:16px;color:var(--muted);flex:none}
  .noticestripempty{cursor:default}
  .noticestripempty:hover{background:none}
  .noticestripempty .noticestriptitle{color:var(--muted)}
  .noticestripempty .noticestripicon{color:var(--muted)}
  .noticerowtitle{flex:1;font-size:18.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noticerowarrow{flex:none;color:var(--muted);font-size:17.5px}

  .featuredgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .featuredcard{
    display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;
    border-radius:16px;padding:22px 20px;font:inherit;border:none;
  }
  .featuredcard.f-green{background:var(--accent);box-shadow:0 4px 14px rgba(77,184,72,.28)}
  .featuredcard.f-orange{background:var(--feature);box-shadow:0 4px 14px rgba(246,139,30,.28)}
  .featuredicon{display:flex;color:#fff;margin-bottom:14px;font-size:26px}
  .featuredtitle{font-weight:700;font-size:25px;color:#fff;display:block;margin-bottom:3px}
  .featureddesc{font-size:12.5px;color:rgba(255,255,255,.85);display:block}

  .tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .gridtile{
    display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;
    background:var(--surface);box-shadow:var(--shadow);border:none;border-radius:14px;
    padding:16px 14px;font:inherit;
  }
  .gridtile:hover{box-shadow:var(--shadow-lg)}
  .gridicon{color:var(--accent);margin-bottom:9px;font-size:22px;line-height:1}
  .gridtitle{font-size:20px;font-weight:600;color:var(--ink)}

  .noticedate{font-size:14px;color:var(--muted);margin-bottom:10px}
  .posttitlewrap{margin-top:16px}
  .posttitle{font-weight:700;font-size:19.5px}
  .noticebody{font-size:15.5px;line-height:1.6;white-space:pre-wrap}

  @media (max-width:560px){
    .featuredgrid{grid-template-columns:1fr}
    .tilegrid{grid-template-columns:repeat(2,1fr)}
  }
  .tile .d{color:var(--muted);font-size:15.5px;display:block;margin-top:3px}

  /* ---- month picker ---- */
  .pick{display:flex;align-items:center;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
  .pick input[type=month]{
    font:inherit;color:inherit;background:var(--surface);
    border:1px solid var(--rule-strong);border-radius:3px;padding:6px 9px;
  }
  .arrow{
    width:32px;height:32px;flex:none;border:1px solid var(--rule-strong);background:var(--surface);
    color:var(--ink);border-radius:3px;font-size:17.5px;line-height:1;cursor:pointer;
  }
  .arrow:hover{border-color:var(--ink)}
  .pick .label{font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:21.5px;margin-right:4px}

  /* ---- 근무표 재설계 ---- */
  .schedtabs{display:flex;gap:6px;margin:16px 0}
  .schedtab{
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface);
    color:var(--muted);border:none;box-shadow:var(--shadow);border-radius:10px;padding:8px 16px;
  }
  .schedtab.on{background:var(--ink);color:var(--surface)}

  .celldots{display:flex;gap:3px;margin-top:2px}
  .celldot{width:5px;height:5px;border-radius:50%;flex:none}
  .celldot.dot-c0{background:var(--accent)}
  .celldot.dot-c1{background:var(--feature)}
  .celldot.dot-c2{background:var(--sat)}

  .cal.chips-mode{background:none;box-shadow:none;border-radius:0;padding:0;overflow:visible}
  .cal.chips-mode .dow{padding:0 0 8px}
  .cal.chips-mode .grid{background:var(--rule);border-radius:14px;padding:5px;gap:5px}
  .cal.chips-mode .cell{
    background:var(--surface);border-radius:11px;min-height:145px;
    align-items:stretch;gap:2px;padding:7px 6px;
  }
  .cal.chips-mode .cell.blank{background:transparent}
  .cal.chips-mode .cell.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .cal.chips-mode .num{width:auto;height:auto;border-radius:0;background:none!important;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:2px}
  .cal.chips-mode .cell.today .num{color:var(--accent-text)}
  .cal.chips-mode .cell.sun .num{color:var(--sun)} .cal.chips-mode .cell.sat .num{color:var(--sat)}

  .calnav{display:flex;align-items:center;gap:10px;margin:16px 0 12px;position:relative}
  .calnavlabel{font-size:18px;font-weight:700;color:var(--ink);background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
  .calnavlabel:hover{text-decoration:underline}
  .calnavhidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
  .calnavbtn{
    width:30px;height:30px;border-radius:9px;background:var(--surface);box-shadow:var(--shadow);
    border:none;font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .calnavbtn:hover{color:var(--ink)}
  .cellchip{
    display:block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;
    line-height:1.4;word-break:keep-all;white-space:normal;
  }
  .cellchip.chip-c0{background:var(--accent-soft);color:var(--accent-text)}
  .cellchip.chip-c1{background:var(--feature-soft);color:#8A4A1A}
  .cellchip.chip-c2{background:#E7EFF6;color:#2E5E82}

  .caldetailtitle{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:12px}
  .caldetaillist2{display:flex;flex-direction:column}
  .caldetailrow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
  .caldetailrow2:first-child{border-top:none}
  .caldetailname2{font-size:13.5px;color:var(--ink)}
  .caldetailtime2{margin-left:auto;font-size:12px;color:var(--muted)}

  .avatarcircle{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  }
  .avatarcircle.a-green{background:var(--accent-soft);color:var(--accent)}
  .avatarcircle.a-orange{background:var(--feature-soft);color:var(--feature)}

  .daycardrow{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:20px}
  .daycard{
    min-width:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;
    padding:16px 14px;font:inherit;text-align:left;cursor:pointer;border:none;color:var(--ink);
  }
  .daycard.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .daycard.sel{box-shadow:inset 0 0 0 2px var(--ink)}
  .daycarddow{font-size:13.5px;font-weight:700;color:var(--muted)}
  .daycarddow.sun{color:var(--sun)} .daycarddow.sat{color:var(--sat)}
  .daycardcoffee{font-size:12px;color:#8A6A4A;margin-top:3px;font-weight:600}
  .daycardrule{height:1px;background:var(--rule);margin:10px 0}
  .daycardempty{font-size:13px;color:var(--muted)}
  .daycardname{font-size:14px;font-weight:600;color:var(--ink);line-height:1.5;word-break:keep-all}
  .daycardmore{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ---- calendar ---- */
  .cal{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;overflow:hidden;padding:10px}
  .cal .dow,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow div{
    padding:6px 0 10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);
  }
  .cal .dow div:first-child{color:var(--sun)} .cal .dow div:last-child{color:var(--sat)}
  .cell{
    min-height:76px;padding:6px 5px;text-align:left;background:none;font:inherit;color:inherit;cursor:pointer;
    display:flex;flex-direction:column;gap:3px;border-radius:12px;border:none;
  }
  .cell:hover{background:var(--bg)}
  .cell.blank{cursor:default;background:transparent}
  .cell .num{
    font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
  }
  .cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
  .cell.today .num{font-weight:700;color:#fff;background:var(--accent)}
  .cell.worked{background:var(--accent-soft)}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
  .cell .who{font-size:12.5px;color:var(--accent-text);line-height:1.35;overflow:hidden;white-space:pre-line;word-break:keep-all}

  }

  .summarydetail{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}

  .personweek{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:14px;max-width:100%}

  .personweek2name{font-size:16.5px;font-weight:700;color:var(--ink)}

  .personweekdate{font-size:15.5px;color:var(--muted);margin-bottom:10px}
  .personweekbody{display:flex;align-items:stretch;gap:14px}
  .personweekname{
    flex:0 0 auto;min-width:56px;display:flex;align-items:center;justify-content:center;
    font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:21.5px;text-align:center;
    padding:0 6px;word-break:keep-all;
  }
  .personweekrow{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(7,1fr);box-shadow:var(--shadow);border-radius:14px;overflow:hidden}

  /* ---- generic card / list ---- */
  .card{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;margin-top:16px;overflow:hidden}

  .card-head .m{color:var(--muted);font-size:15.5px}
  .card-head .sum{margin-left:auto;color:var(--accent-text);font-weight:500;white-space:nowrap}

  .addrow{padding:13px 15px;border-bottom:1px solid var(--rule);background:var(--accent-soft)}

  .addline.wide .addsep{font-size:13.5px}
  .addsep{font-size:15px;color:var(--muted)}
  .adddur{font-weight:500;color:var(--accent-text);min-width:64px}
  .datebtn{font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:3px;padding:7px 11px}

  input.hoNum{width:110px;text-align:right}

  .diffchart{overflow-x:auto}
  .diffchart svg{display:block;min-width:260px}
  .saleschart svg{display:block;width:100%}
  .chartlabels{display:flex;margin-top:2px}
  .chartlabels span{flex:1 1 0;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap}
  tfoot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:500}

  tfoot .sumval{color:var(--accent-text)}

  table{border-collapse:collapse;width:100%;min-width:480px}
  .table-wrap{overflow-x:auto}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule)}
  th{font-weight:500;font-size:15px;color:var(--muted);border-bottom:1px solid var(--rule-strong);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;white-space:nowrap}
  td.dur{color:var(--accent-text);font-weight:500}
  td.act,th.act{width:40px;text-align:right}
  input[type=time],input[type=date]{

  }

    font:inherit;color:inherit;background:transparent;border:1px solid var(--rule);

  .rowdel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18.5px;line-height:1;padding:4px 6px;border-radius:3px}

  /* ---- name chips ---- */

  .roster{display:flex;flex-direction:column}

  .roster .item .sm{color:var(--muted);font-size:15.5px}
  .roster .item .go{margin-left:auto;border:none;background:none;font:inherit;color:var(--accent-text);cursor:pointer;font-weight:500}
  .rowlink{flex:1;min-width:0;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:10px}

  .undowrap{
    margin-top:14px;background:var(--surface);box-shadow:var(--shadow);border-left:3px solid var(--accent);
    border-radius:14px;overflow:hidden;

  .undotitle{padding:10px 15px 6px;font-size:15px;color:var(--muted)}
  .undorow{display:flex;align-items:center;gap:10px;padding:8px 15px;border-top:1px solid var(--rule)}

  .btn{font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:10px 20px;box-shadow:var(--shadow)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule-strong)}
  .btn.ghost.danger{color:var(--danger)}
  .prepayactions{display:flex;gap:8px;margin-top:10px}
  .checkrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .checkbtn{
    min-width:44px;height:44px;padding:0 10px;border-radius:10px;
    background:var(--surface);box-shadow:var(--shadow);border:none;
    font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .checkbtn.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
  .checkbtn-wide{padding:0 16px}

  .sigpad{margin:14px 0 4px;max-width:760px}
  .sigcanvaswrap{position:relative}
  .sigcanvas{
    display:block;width:100%;aspect-ratio:760/320;
    background:#fff;border-radius:12px;box-shadow:var(--shadow);
    cursor:crosshair;touch-action:none;
  }
  .sighint{
    position:absolute;top:0;left:0;right:0;bottom:0;display:flex;
    align-items:center;justify-content:center;color:var(--rule-strong);
    font-size:14px;pointer-events:none;
  }
  .visitlist{display:flex;flex-direction:column;gap:14px}
  .visititem{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
  .visititem:last-child{border-bottom:none;padding-bottom:0}
  .visitinfo{display:flex;align-items:center;gap:10px}
  .visitdate{font-size:14.5px;font-weight:600;color:var(--ink)}
  .visitcount{font-size:13px;color:var(--muted)}
  .visitcum{font-size:12.5px;color:var(--accent-text);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
  .prepaysearch{padding-top:14px;padding-bottom:0}
  .prepaysearchempty{padding-top:0}
  .visitinfo .rowdel{margin-left:auto}
  .sigthumb{width:90px;max-width:100%;border-radius:6px;box-shadow:var(--shadow);background:#fff}
  .remaincard{
    background:var(--surface);box-shadow:var(--shadow);border-radius:16px;
    padding:20px;margin:16px 0;text-align:center;
  }
  .remainnum{font-size:32px;font-weight:700;color:var(--accent-text)}
  .remainnum.low{color:var(--danger)}
  .remainstats{display:flex;justify-content:center;gap:28px;margin-top:10px}
  .remainstat{display:flex;flex-direction:column;align-items:center}
  .remainstatnum{font-size:17px;font-weight:700;color:var(--ink)}
  .remainstatlabel{font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn.ghost:hover{border-color:var(--ink);filter:none}
  .ti{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}

  .field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .field label{font-size:15.5px;color:var(--muted)}

  .bigline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .bignum{font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:clamp(28px,7vw,42px);line-height:1.1}
  .bignum span{font-size:.4em;font-family:'NEXON Lv1 Gothic',sans-serif;font-weight:400;margin-left:2px}

  .hoverable{border-bottom:1px dotted var(--rule-strong);cursor:help}
  #tip{
    position:absolute;z-index:50;display:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--rule-strong);border-radius:4px;padding:9px 11px;font-size:15.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:min(300px,86vw);
  }
  #tip .tiphead{font-size:15px;color:var(--muted);margin-bottom:6px}
  #tip .cal{border:none;box-shadow:none;background:none}
  #tip .cal .cell{border-color:transparent;min-height:26px}

  #datepop{
    position:absolute;z-index:60;display:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--rule-strong);border-radius:4px;padding:10px;font-size:15.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.16);width:260px;
  }
  #datepop .cal{border:none;box-shadow:none;background:none}
  #datepop .cal .cell{border-color:transparent;min-height:30px}
  #datepop .denav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  #datepop .delabel{font-family:'NEXON Lv1 Gothic',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:17px;flex:1;text-align:center}
  #datepop .arrow{width:26px;height:26px;font-size:15.5px}

  .note{color:var(--muted);font-size:15.5px;margin-top:10px}
  .status{color:var(--muted);font-size:15px;margin-top:10px;min-height:1em}
  .status.warn{color:var(--danger)}
  .status.success{color:var(--accent-text);font-weight:500}

  @media (max-width:560px){
    .wrap{padding:18px 11px 80px}
    .cell{min-height:60px}
    .cell .who{display:none}
    .wcell{min-height:76px;padding:4px 3px}
    .wname{font-size:12.5px}
    .personweekname{min-width:40px;font-size:17.5px}
    .personweekbody{gap:8px}
    .coffeebadge{position:static;display:block;text-align:left;font-size:10.5px;margin-top:1px;white-space:normal}
    .wdow{font-size:13.5px}
    .wcell .num{margin-bottom:.3em;font-size:13px}
    table{min-width:0}
    th,td{padding:6px 5px;font-size:13.5px}
    th{font-size:12.5px;white-space:normal}
    .daycardrow{grid-template-columns:repeat(3,1fr)}
    .addline.wide{flex-wrap:wrap}
    .addline.wide input.ti,.addline.wide .datebtn{flex:none;min-width:120px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="tip" role="tooltip"></div>
<div id="datepop" role="dialog" aria-label="날짜 선택"></div>

<script>
(function(){
  "use strict";

  /* ===================== state ===================== */
  var LS_KEY = "shift-log-v2";
  var REMOVED_KEY = "shift-log-v2-removed";
  var RECENT_REMOVED_KEY = "shift-log-v2-recent-removed";
  var db = null, subs = [], subYm = null;

  // 삭제는 서버 저장 권한과 상관없이 이 브라우저에서는 반드시 적용되도록,
  // 지운 근무자의 id 를 별도로 로컬에 남겨 둔다.
  var removedIds = (function(){
    try{ return new Set(JSON.parse(localStorage.getItem(REMOVED_KEY)||"[]")); }
    catch(e){ return new Set(); }
  })();
  function persistRemovedIds(){
    try{ localStorage.setItem(REMOVED_KEY, JSON.stringify(Array.from(removedIds))); }catch(e){}
  }
  function applyRemovedOverride(){
    state.employees.forEach(function(e){ if(removedIds.has(e.id)) e.active=false; });
  }

  var state = {
    view: "home",
    ym: ymOf(new Date()),
    empId: null,        // 개인 근무 확인 대상
    selDate: null,      // 매장 근무 기록에서 고른 날짜
    salesSelDate: null, // 관리자 > 매장 매출에서 고른 날짜
    handoverEditId: null, // 인수인계 기록 중 수정 중인 것
    checklist: {},         // 체크리스트 항목별 체크 여부
    prepayCustomers: [],   // 횟수 선결제 고객 목록
    prepayVisits: {},      // 고객id별 방문 기록(서명 포함)
    prepaySelId: null,     // 선택된 횟수 선결제 고객
    prepayAmtCustomers: [], // 금액 선결제 고객 목록
    prepayAmtVisits: {},    // 고객id별 사용 기록(서명 포함)
    prepayAmtSelId: null,   // 선택된 금액 선결제 고객
    prepayTab: "count",     // 선결제 목록 탭: count | amt
    prepayEditId: null,     // 수정 중인 횟수 선결제 고객
    prepayAmtEditId: null,  // 수정 중인 금액 선결제 고객
    clockEmp: null,     // 출퇴근 기록에서 고른 근무자
    employees: [],      // [{id,name,wage}]
    data: {},            // data[ym][empId] = [{id,date,inT,outT}]
    handover: {},        // handover[ym] = [{id,date,cash,card,posCash}]
    schedule: {},        // schedule[weekStart][dateStr] = [{empId, role}]  role: "open" | "close" | null
    schedWeek: sundayOfStr(todayStr()),      // 근무표에서 보고 있는 주의 일요일 날짜
    schedSelDate: null,   // 근무표에서 고른 날짜
    schedSummaryEmp: null,// 근무표 하단 요약에서 고른 근무자
    schedCalYm: ymOf(new Date()),   // 근무표 하단 큰 달력에서 보고 있는 달
    schedTab: "month",              // 근무표 페이지 탭: month | week
    schedCalSelDate: null,          // 그 달력에서 고른 날짜
    posts: [],              // [{id,title,content,createdAt,isNotice,noticeUntil,comments:[{id,name,content,createdAt}]}]
    boardSelId: null,       // 게시판에서 고른 글
    boardWriting: false,    // 게시판에서 새 글 작성 중인지
    boardFromHome: false,   // 홈 공지사항에서 바로 들어왔는지 (뒤로가기 목적지 결정)
    boardEditId: null,      // 수정 중인 게시글
    boardFilter: "all",     // 게시판 탭: all | notice | free
    boardPage: 1,           // 게시판 목록 페이지
    commentEditId: null,    // 수정 중인 댓글
    coffeeFrontFirst: true, // 일요일에 "커피 앞"부터 시작할지, "커피 뒤"부터 시작할지
    adminPassword: "12345",
    adminUnlocked: false,  // 정산·관리자 메뉴에 새로 들어갈 때마다 다시 확인한다
    adminSection: null    // 관리자 안에서 고른 하위 항목: password | settle | backup
  };

  var VIEWS = {
    home:     { title:"창릉 프리미어" },
    store:    { title:"매장 근무 기록" },
    clock:    { title:"출퇴근 기록" },
    overall:  { title:"전체 근무 확인" },
    people:   { title:"개인 근무 확인" },
    person:   { title:"개인 근무 확인" },
    add:      { title:"근무자 추가" },
    handover: { title:"일일 인수인계" },
    board:    { title:"게시판" },
    checklist:{ title:"체크리스트" },
    prepay:{ title:"선결제" },
    prepaydetail:{ title:"연습장 선결제" },
    prepayamtdetail:{ title:"금액 선결제" },
    admin:    { title:"관리자" },
    schedule: { title:"근무표" }
  };

  /* ===================== helpers ===================== */
  function pad(n){ return String(n).padStart(2,"0"); }
  function ymOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
  function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayStr(){ return dateStr(new Date()); }
  function ymOfDate(s){ return (s||"").slice(0,7); }
  function parseDateStr(ds){ var p=ds.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDaysStr(ds, n){ var d=parseDateStr(ds); d.setDate(d.getDate()+n); return dateStr(d); }
  function addMonthsStr(ds, n){ var d=parseDateStr(ds); d.setMonth(d.getMonth()+n); return dateStr(d); }
  function daysBetweenStr(a, b){
    var da=parseDateStr(a), db=parseDateStr(b);

  function positionFloating(box, target){
    box.style.display="block";
    var r=target.getBoundingClientRect();
    var top=window.scrollY+r.bottom+8;
    var left=window.scrollX+r.left;
    var w=box.offsetWidth;
    if(left+w>window.scrollX+document.documentElement.clientWidth-10){
      left=window.scrollX+document.documentElement.clientWidth-w-10;
    }
    if(left<window.scrollX+8) left=window.scrollX+8;
    box.style.top=top+"px"; box.style.left=left+"px";
  }

  function sortedDayEntries(entries){
    var open=[], mid=[], close=[];
    entries.forEach(function(e){
      if(e.role==="open") open.push(e);
      else if(e.role==="close") close.push(e);
      else mid.push(e);
    });
    function byIn(a,b){ return (a.inT||"").localeCompare(b.inT||""); }
    mid.sort(byIn);
    close.sort(byIn);
    return open.concat(mid).concat(close);
  }
  function timeRangeText(entry){
    var left = entry.role==="open" ? "오픈" : (entry.inT||"");
    var right = entry.role==="close" ? "마감" : (entry.outT||"");
    if(!left && !right) return "";
    if(left && right) return left+"\u2011"+right;
    return left||right;
  }

  function buildCalendar(ym, map, opts){
    opts=opts||{};
    var cal=el("div","cal"+(opts.compact?" compact":"")+(opts.chips?" chips-mode":""));
    var dow=el("div","dow");
    ["일","월","화","수","목","금","토"].forEach(function(d){ dow.appendChild(el("div",null,d)); });
    cal.appendChild(dow);

    var grid=el("div","grid");
    var lead=firstDow(ym), total=daysInMonth(ym), today=todayStr();

    for(var i=0;i<lead;i++) grid.appendChild(el("div","cell blank"));

    for(var d=1; d<=total; d++){
      var ds=ym+"-"+pad(d);
      var entries=map[ds]||[];
      var dowIdx=(lead+d-1)%7;
      var cell=document.createElement(opts.compact?"div":"button");
      cell.className="cell"+(dowIdx===0?" sun":"")+(dowIdx===6?" sat":"")
        +(entries.length?" worked":"")+(ds===today?" today":"")
        +(opts.selected===ds?" sel":"");
      if(cell.tagName==="BUTTON") cell.type="button";
      cell.appendChild(el("div","num",String(d)));

      if(!opts.compact){
        var mins=0, any=false;
        entries.forEach(function(e){ if(e.min!==null){ mins+=e.min; any=true; } });
        if(entries.length && opts.chips){
          var seen={};
          var uniqEntries=entries.filter(function(e){
            var id=e.emp?e.emp.id:"?";
            if(seen[id]) return false;
            seen[id]=true; return true;
          });
          uniqEntries.forEach(function(e,di){
            cell.appendChild(el("span","cellchip chip-c"+(di%3), e.emp? e.emp.name : "?"));
          });
        }else if(entries.length && opts.dots){
          var dotsWrap=el("div","celldots");
          entries.slice(0,4).forEach(function(e,di){
            dotsWrap.appendChild(el("span","celldot dot-c"+(di%3)));
          });
          cell.appendChild(dotsWrap);
        }else if(entries.length && opts.showNames!==false){
          var names=entries.map(function(e){ return e.emp?e.emp.name:"?"; });
          var uniq=[];
          names.forEach(function(n){ if(uniq.indexOf(n)<0) uniq.push(n); });
          var lines=[];
          for(var k=0;k<uniq.length;k+=2){ lines.push(uniq.slice(k,k+2).join(", ")); }
          cell.appendChild(el("div","who", lines.join("\n")));
        }
        if(any && opts.showHours!==false) cell.appendChild(el("div","hrs", fmtDur(mins)));
      }

      if(opts.onPick){
        (function(ds){ cell.addEventListener("click", function(){ opts.onPick(ds); }); })(ds);
      }
      if(opts.tipFor && entries.length){
        (function(ds,entries){
          attachTip(cell, function(box){
            box.appendChild(el("div","tiphead", dayLabel(ds)));
            entries.forEach(function(e){
              var line=(opts.tipNames? (e.emp?e.emp.name+" · ":"") : "")
                + (e.row.inT||"--:--")+" – "+(e.row.outT||"--:--")
                + "  ·  "+fmtDur(e.min);
              box.appendChild(el("div",null,line));
            });
          });
        })(ds, entries);
      }
      grid.appendChild(cell);
    }
    var tail=(7-((lead+total)%7))%7;
    for(var j=0;j<tail;j++) grid.appendChild(el("div","cell blank"));
    cal.appendChild(grid);
    return cal;
  }

  function buildSignaturePad(){
    var wrap=el("div","sigpad");
    var canvasWrap=el("div","sigcanvaswrap");
    var canvas=document.createElement("canvas");
    canvas.width=760; canvas.height=320; canvas.className="sigcanvas";
    canvas.style.touchAction="none";
    canvasWrap.appendChild(canvas);
    var hint=el("div","sighint","여기에 서명해 주세요");
    canvasWrap.appendChild(hint);
    wrap.appendChild(canvasWrap);
    var ctx=canvas.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1F2A22";
    var drawing=false, lastX=0, lastY=0, hasSignature=false;

    function pos(e){
      var rect=canvas.getBoundingClientRect();
      var scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing=true; hasSignature=true;
      var p=pos(e); lastX=p.x; lastY=p.y;
      if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    canvas.addEventListener("pointermove", function(e){
      if(!drawing) return;
      var p=pos(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y;
      e.preventDefault();
    });
    function stop(){ drawing=false; }
    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointerleave", stop);
    canvas.addEventListener("pointercancel", stop);

    canvas.addEventListener("pointerdown", function(){ hint.style.display="none"; });

    var clearBtn=el("button","btn ghost","지우기"); clearBtn.type="button";
    clearBtn.addEventListener("click", function(){
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      hasSignature=false;
      hint.style.display="";
    });
    wrap.appendChild(clearBtn);

    return {
      el: wrap,
      isEmpty: function(){ return !hasSignature; },
      toDataURL: function(){ return canvas.toDataURL("image/png"); }
    };
  }

    var PAGE_SIZE=20;
    var totalPages=Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));

  function buildAddForm(emp, ym){
    var draft={ date: (ymOfDate(todayStr())===ym ? todayStr() : ym+"-01"), inT:"", outT:"" };
    var wrap=el("div","addrow");
    wrap.appendChild(el("div","addlabel","새 기록 (900, 9:00, 0900 모두 09:00으로 정리됩니다)"));

    var line=el("div","addline");

    var dateBtn=document.createElement("button");
    dateBtn.type="button"; dateBtn.className="ti datebtn";
    dateBtn.textContent=dayLabel(draft.date);
    dateBtn.addEventListener("click", function(){
      openDatePicker(dateBtn, draft.date, function(ds){ draft.date=ds; dateBtn.textContent=dayLabel(ds); });
    });
    line.appendChild(dateBtn);

    var durOut=el("span","adddur","—");
    function updatePreview(){
      durOut.textContent=fmtDur(worked({ inT: normalizeTime(inI.value), outT: normalizeTime(outI.value) }));
    }
    function commitIn(){ draft.inT=normalizeTime(inI.value); inI.value=draft.inT; updatePreview(); }
    function commitOut(){ draft.outT=normalizeTime(outI.value); outI.value=draft.outT; updatePreview(); }
    var inI=timeField(draft.inT, commitIn, updatePreview);
    var outI=timeField(draft.outT, commitOut, updatePreview);

    line.appendChild(el("span","addsep","출근"));
    line.appendChild(inI);
    line.appendChild(el("span","addsep","퇴근"));
    line.appendChild(outI);
    line.appendChild(durOut);
    wrap.appendChild(line);

    var addBtn=el("button","btn","기록 추가");
    addBtn.type="button";
    addBtn.addEventListener("click", function(){
      draft.inT=normalizeTime(inI.value); draft.outT=normalizeTime(outI.value);
      if(!draft.date){ setStatus("날짜를 먼저 선택해 주세요.", true); return; }
      var newRow={ id:uid(), date:draft.date, inT:draft.inT, outT:draft.outT };
      setRows(ym, emp.id, rowsOf(ym, emp.id).concat([newRow]));
      saveMonth(ym, emp.id);
      setStatus("");
      render(true);
    });
    wrap.appendChild(addBtn);
    return wrap;
  }

  function clockRow(emp, row, ym){
    var tr=document.createElement("tr");

    // 날짜: 글자로 보여주고, 옆의 ✎ 버튼으로 달력 팝업을 열어 고른다
    var tdDate=document.createElement("td");
    var dateSpan=el("span",null, row.date? dayLabel(row.date) : "날짜 없음");
    var ed=el("button","rowdel","✎"); ed.type="button"; ed.title="날짜 수정"; ed.setAttribute("aria-label","날짜 수정");
    ed.addEventListener("click", function(e){
      e.stopPropagation();
      openDatePicker(ed, row.date, function(ds){ changeDate(emp, row, ym, ds); });
    });
    tdDate.appendChild(dateSpan); tdDate.appendChild(ed);

    var tdDur=el("td","num dur", fmtDur(worked(row)));

    function onTime(){
      row.inT=normalizeTime(inI.value); row.outT=normalizeTime(outI.value);
      inI.value=row.inT; outI.value=row.outT;
      tdDur.textContent=fmtDur(worked(row));
      saveMonth(ym, emp.id);
      var sum=tr.closest(".card").querySelector(".card-head .sum");
      if(sum) sum.textContent="합계 "+fmtDur(monthTotal(ym, emp.id));
    }
    function previewTime(){
      var m=worked({ inT: normalizeTime(inI.value), outT: normalizeTime(outI.value) });
      tdDur.textContent=fmtDur(m);
    }
    var inI=timeField(row.inT, onTime, previewTime), outI=timeField(row.outT, onTime, previewTime);
    var tdIn=document.createElement("td"); tdIn.appendChild(inI);
    var tdOut=document.createElement("td"); tdOut.appendChild(outI);

    var tdAct=el("td","act");
    var del=el("button","rowdel","×"); del.title="이 기록 지우기"; del.setAttribute("aria-label","이 기록 지우기");
    del.addEventListener("click", function(){
      setRows(ym, emp.id, rowsOf(ym, emp.id).filter(function(r){ return r.id!==row.id; }));
      saveMonth(ym, emp.id); render(true);
    });
    tdAct.appendChild(del);

    tr.appendChild(tdDate); tr.appendChild(tdIn); tr.appendChild(tdOut);
    tr.appendChild(tdDur); tr.appendChild(tdAct);
    return tr;
  }

  function changeDate(emp, row, ym, newDate){
    if(!newDate) return;
    var newYm=ymOfDate(newDate);
    if(newYm===ym){
      row.date=newDate; saveMonth(ym, emp.id); render(true); return;
    }
    // 다른 달로 옮기기
    setRows(ym, emp.id, rowsOf(ym, emp.id).filter(function(r){ return r.id!==row.id; }));
    saveMonth(ym, emp.id);
    ensureMonth(newYm).then(function(){
      var moved={ id:row.id, date:newDate, inT:row.inT, outT:row.outT };
      setRows(newYm, emp.id, rowsOf(newYm, emp.id).concat([moved]));
      return saveMonth(newYm, emp.id);
    }).then(function(){ render(true); });
  }

  // 되돌리기 목록 — id/이름만 담은 스냅샷이라 서버 동기화로 직원 객체가 새로 만들어져도 안전하고,
  // 로컬에 저장해서 페이지를 오가거나 새로고침해도 되돌리기·닫기(×) 전까지 계속 남아 있다.
  var recentRemovals=(function(){
    try{ return JSON.parse(localStorage.getItem(RECENT_REMOVED_KEY)||"[]"); }
    catch(e){ return []; }
  })();
  function persistRecentRemovals(){
    try{ localStorage.setItem(RECENT_REMOVED_KEY, JSON.stringify(recentRemovals)); }catch(e){}
  }
  function removeEmployee(emp){
    removedIds.add(emp.id);
    persistRemovedIds();
    emp.active=false;
    state.employees=state.employees.map(function(e){ return e.id===emp.id? emp : e; });
    if(state.clockEmp===emp.id) state.clockEmp=null;
    if(!recentRemovals.some(function(e){ return e.id===emp.id; })){
      recentRemovals.unshift({ id: emp.id, name: emp.name });
      persistRecentRemovals();
    }
    render(true);
    try{ saveEmployees(); }catch(e){ console.error(e); setStatus("서버 저장에는 실패했지만 이 화면에서는 계속 삭제된 상태로 유지됩니다.", true); }
  }
  function undoRemove(id){
    removedIds.delete(id);
    persistRemovedIds();
    var emp=empById(id);
    if(emp){
      emp.active=true;
      state.employees=state.employees.map(function(e){ return e.id===id? emp : e; });
    }
    recentRemovals=recentRemovals.filter(function(e){ return e.id!==id; });
    persistRecentRemovals();
    render(true);
    try{ saveEmployees(); }catch(e){ console.error(e); setStatus("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", true); }
  }
  function dismissRemoval(id){
    recentRemovals=recentRemovals.filter(function(e){ return e.id!==id; });
    persistRecentRemovals();
    render(true);
  }

  /* ---- 일일 인수인계 ---- */
  function fmtWon(n){
    return Math.round(n||0).toLocaleString("ko-KR")+"원";
  }
  function numberField(value){
    var i=document.createElement("input");

  function handoverDayMap(ym){
    var map={};
    rowsOfHandover(ym).forEach(function(r){
      if(!r.date) return;
      var e=map[r.date]=(map[r.date]||{cash:0,card:0,posCash:0,count:0});
      e.cash+=r.cash||0; e.card+=r.card||0; e.posCash+=r.posCash||0; e.count+=1;
    });
    return map;
  }
  function buildHandoverCalendar(ym, map, opts){
    opts=opts||{};
    var cal=el("div","cal");
    var dow=el("div","dow");
    ["일","월","화","수","목","금","토"].forEach(function(d){ dow.appendChild(el("div",null,d)); });
    cal.appendChild(dow);
    var grid=el("div","grid");
    var lead=firstDow(ym), total=daysInMonth(ym), today=todayStr();
    for(var i=0;i<lead;i++) grid.appendChild(el("div","cell blank"));
    for(var d=1; d<=total; d++){
      var ds=ym+"-"+pad(d);
      var entry=map[ds];
      var dowIdx=(lead+d-1)%7;
      var cell=document.createElement("button");
      cell.type="button";
      cell.className="cell"+(dowIdx===0?" sun":"")+(dowIdx===6?" sat":"")
        +(entry?" worked":"")+(ds===today?" today":"")+(opts.selected===ds?" sel":"");
      cell.appendChild(el("div","num",String(d)));
      if(entry) cell.appendChild(el("div","hrs", fmtWon(entry.cash+entry.card)));
      if(opts.onPick){ (function(ds){ cell.addEventListener("click", function(){ opts.onPick(ds); }); })(ds); }
      grid.appendChild(cell);
    }
    var tail=(7-((lead+total)%7))%7;
    for(var j=0;j<tail;j++) grid.appendChild(el("div","cell blank"));
    cal.appendChild(grid);
    return cal;
  }
  function buildSalesChart(ym, map){
    var total=daysInMonth(ym);
    var days=[];
    for(var d=1; d<=total; d++){
      var ds=ym+"-"+pad(d);
      var entry=map[ds];
      days.push({
        ds:ds, d:d,
        cash: entry? entry.cash:0,
        card: entry? entry.card:0,
        sum: entry? (entry.cash+entry.card):0,
        has: !!entry
      });
    }
    var wrap=el("div","saleschart");
    var any=days.some(function(x){ return x.has; });
    if(!any){
      wrap.appendChild(el("div","empty","표시할 기록이 없습니다."));
      return wrap;
    }
    var maxV=1;
    days.forEach(function(x){ maxV=Math.max(maxV, x.sum); });

    // 카드 너비 전체를 채우도록 고정된 좌표계(뷰박스)를 쓰고, viewBox 폭을 날짜 수에 맞춰 나눈다.
    // 글자는 SVG 안에 넣지 않는다 — none 비율로 늘리면 숫자가 옆으로 찌그러져 가독성이 떨어진다.
    var W=1000, H=190;
    var padL=6, padR=6, padT=10, padB=6;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var n=days.length;
    var slot=plotW/n;
    var barW=Math.max(2, slot*0.62);
    var gap=(slot-barW)/2;

    var parts=[];
    // 격자선(0%, 50%, 100%)
    [0,0.5,1].forEach(function(f){
      var y=padT+plotH*(1-f);
      parts.push('<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--rule)" stroke-width="1"/>');
    });

    days.forEach(function(x,i){
      if(!x.has) return;
      var x0=padL+i*slot+gap;
      var h=Math.max(2, Math.round((x.sum/maxV)*plotH));
      var y=padT+plotH-h;
      var titleText=x.d+"일\n현금 매출 "+fmtWon(x.cash)+"\n카드 매출 "+fmtWon(x.card)+"\n합계 매출 "+fmtWon(x.sum);
      parts.push('<g><title>'+titleText+'</title><rect x="'+x0.toFixed(1)+'" y="'+y+'" width="'+barW.toFixed(1)+'" height="'+h+'" rx="2" fill="var(--accent)"></rect></g>');
    });

    var svgHtml='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" preserveAspectRatio="none" role="img" aria-label="일별 매출 그래프">'+parts.join('')+'</svg>';
    wrap.innerHTML=svgHtml;

    // 날짜 숫자는 일반 HTML 로, 그래프와 같은 칸 나누기로 아래에 맞춰 그린다 (1일·말일은 항상, 그 사이는 5일 간격)
    var labels=el("div","chartlabels");
    days.forEach(function(x){
      var show = (x.d===1 || x.d===n || x.d%5===0);
      labels.appendChild(el("span",null, show? String(x.d) : ""));
    });
    wrap.appendChild(labels);
    return wrap;
  }

    app.appendChild(el("p","lede","날짜를 고르고 현금·카드 매출과 포스기 현금을 적은 뒤 ‘추가하기’를 누르면 목록에 쌓입니다."));

    var form=el("div","addrow");

    var line=el("div","addline wide");
    var closerI=document.createElement("input");

    function autofillCloser(ds){

  function appendDayEditor(app, weekStart, ds){
    var entries=scheduleDayEntries(weekStart, ds);
    var assignedIds=entries.map(function(e){ return e.empId; });

    var card=el("div","card");
    var head=el("div","card-head");
    head.appendChild(el("div","h", dayLabel(ds)+" 배정"));
    card.appendChild(head);
    var pad=el("div","pad");

    var sorted=sortedDayEntries(entries);
    if(sorted.length){
      var list=el("div","assignlist");
      sorted.forEach(function(entry){
        var emp=empById(entry.empId);
        var row=el("div","assignrow");

        var top=el("div","assigntop");
        top.appendChild(avatarCircle(emp? emp.name : "?", entry.role==="close"? "a-orange":"a-green"));
        top.appendChild(el("span","aname", emp? emp.name : "삭제된 근무자"));
        var roleWrap=el("div","rolebtns");
        var openBtn=el("button","rolebtn"+(entry.role==="open"?" on":""),"오픈"); openBtn.type="button";
        var closeBtn=el("button","rolebtn"+(entry.role==="close"?" on":""),"마감"); closeBtn.type="button";
        openBtn.addEventListener("click", function(){ setRole(entry.empId, entry.role==="open"? null : "open"); });
        closeBtn.addEventListener("click", function(){ setRole(entry.empId, entry.role==="close"? null : "close"); });
        roleWrap.appendChild(openBtn); roleWrap.appendChild(closeBtn);
        top.appendChild(roleWrap);
        var rm=el("button","rowdel","×"); rm.type="button"; rm.title="제외";
        rm.setAttribute("aria-label", (emp?emp.name:"")+" 제외");
        rm.addEventListener("click", function(){ removeFromDay(entry.empId); });
        top.appendChild(rm);
        row.appendChild(top);

        var timeLine=el("div","assigntime");
        var inI=null, outI=null;
        if(entry.role!=="open"){
          timeLine.appendChild(el("span","addsep","출근"));
          inI=timeField(entry.inT, commitTime);
          timeLine.appendChild(inI);
        }
        if(entry.role!=="close"){
          timeLine.appendChild(el("span","addsep","퇴근"));
          outI=timeField(entry.outT, commitTime);
          timeLine.appendChild(outI);
        }
        row.appendChild(timeLine);
        function commitTime(){
          var newIn = entry.role==="open" ? "" : normalizeTime(inI.value);
          var newOut = entry.role==="close" ? "" : normalizeTime(outI.value);
          setTime(entry.empId, newIn, newOut);
        }

        list.appendChild(row);
      });
      pad.appendChild(list);
    }else{
      pad.appendChild(el("div","empty","아직 배정된 근무자가 없습니다."));
    }

    var rest=activeEmployees().filter(function(e){ return assignedIds.indexOf(e.id)<0; });
    if(rest.length){
      pad.appendChild(el("div","addlabel","근무자 추가"));
      var chips=el("div","chips");
      rest.forEach(function(emp){
        var b=el("button","chip", emp.name);
        b.addEventListener("click", function(){ addToDay(emp.id); });
        chips.appendChild(b);
      });
      pad.appendChild(chips);
    }

    card.appendChild(pad);
    app.appendChild(card);

    function persist(newEntries){
      setScheduleDayEntries(weekStart, ds, newEntries);
      saveSchedule(weekStart);
      setTimeout(function(){ render(true); }, 0);
    }
    function addToDay(empId){ persist(entries.concat([{ empId:empId, role:null, inT:"", outT:"" }])); }
    function removeFromDay(empId){ persist(entries.filter(function(e){ return e.empId!==empId; })); }
    function setRole(empId, role){
      persist(entries.map(function(e){
        if(e.empId!==empId) return e;
        var inT=e.inT, outT=e.outT;
        if(role==="open") inT="";
        if(role==="close") outT="";
        return { empId:empId, role:role, inT:inT, outT:outT };
      }));
    }
    function setTime(empId, inT, outT){
      persist(entries.map(function(e){ return e.empId===empId? { empId:empId, role:e.role, inT:inT, outT:outT } : e; }));
    }
  }

  function captureAndCopy(target, filenameBase, msgEl){
    if(typeof html2canvas!=="function"){
      msgEl.textContent="이미지 캡처 기능을 사용할 수 없습니다.";
      msgEl.className="status warn";
      return;
    }
    msgEl.textContent="이미지를 만드는 중...";
    msgEl.className="status";
    var bg=getComputedStyle(document.body).backgroundColor || "#ffffff";
    html2canvas(target, { backgroundColor: bg, scale: 2 }).then(function(canvas){
      canvas.toBlob(function(blob){
        if(!blob){
          msgEl.textContent="이미지를 만들지 못했습니다.";
          msgEl.className="status warn";
          return;
        }
        tryClipboard(blob);
      });
    }).catch(function(){
      msgEl.textContent="이미지를 만들지 못했습니다.";
      msgEl.className="status warn";
    });

    function tryClipboard(blob){
      if(navigator.clipboard && window.ClipboardItem){
        navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]).then(function(){
          msgEl.textContent="이미지가 복사되었습니다. 카카오톡 채팅창에 붙여넣기(Ctrl/Cmd+V) 하시면 됩니다.";
          msgEl.className="status success";
        }).catch(function(){ fallbackSave(blob); });
      }else{
        fallbackSave(blob);
      }
    }
    function fallbackSave(blob){
      var filename=filenameBase.replace(/\s+/g,"_")+"_"+todayStr()+".png";
      if(window.claude && typeof window.claude.use==="function"){
        var reader=new FileReader();
        reader.onload=function(){
          window.claude.use("downloads").then(function(dl){
            if(!dl){ plainDownload(blob, filename); return; }
            return dl.save({ filename:filename, data:reader.result }).then(function(){
              msgEl.textContent="클립보드 복사를 지원하지 않아 이미지 파일로 저장했습니다. 카카오톡에서 이 파일을 첨부해 주세요.";
              msgEl.className="status success";
            }).catch(function(){ plainDownload(blob, filename); });
          }).catch(function(){ plainDownload(blob, filename); });
        };
        reader.readAsDataURL(blob);
      }else{
        plainDownload(blob, filename);
      }
    }
    function plainDownload(blob, filename){
      try{
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        msgEl.textContent="클립보드 복사를 지원하지 않아 이미지 파일로 저장했습니다. 카카오톡에서 이 파일을 첨부해 주세요.";
        msgEl.className="status success";
      }catch(e){
        msgEl.textContent="이미지를 저장하지 못했습니다.";
        msgEl.className="status warn";
      }
    }
  }

  function renderSettleContent(app){

    var tb=document.createElement("tbody");
    var rowRefs=[];

    activeEmployees().forEach(function(emp){
      var totalMin=monthTotal(ym, emp.id);
      var tr=document.createElement("tr");
      tr.appendChild(el("td",null, emp.name));
      tr.appendChild(el("td","num", fmtDur(totalMin)));

      var tdWage=el("td","num");
      var wageI=document.createElement("input");
      wageI.type="number"; wageI.className="ti hoNum"; wageI.min="0"; wageI.step="10";
      wageI.placeholder="시급";
      if(emp.wage!=null) wageI.value=emp.wage;
      tdWage.appendChild(wageI);
      tr.appendChild(tdWage);

      var tdPay=el("td","num dur");
      tr.appendChild(tdPay);
      tb.appendChild(tr);

      function payOf(){
        var w=parseFloat(wageI.value);
        if(!(w>0)) return 0;
        var gross=totalMin/60*w;
        return Math.floor(gross*(1-0.033));
      }
      function paintRow(){
        var w=parseFloat(wageI.value);
        tdPay.textContent = (w>0)? fmtWon(payOf()) : "—";
      }
      paintRow();

      var saveTimer=null;
      wageI.addEventListener("input", function(){
        paintRow();
        recomputeGrand();
        clearTimeout(saveTimer);
        saveTimer=setTimeout(function(){
          var w=parseFloat(wageI.value);
          emp.wage=(w>0? w : null);
          state.employees=state.employees.map(function(e){ return e.id===emp.id? emp : e; });
          saveEmployees();
        }, 500);
      });

      rowRefs.push({ payOf: payOf });
    });
    table.appendChild(tb);

    var tf=document.createElement("tfoot");
    var ftr=document.createElement("tr");
    ftr.appendChild(el("td","sumlabel","합계"));
    ftr.appendChild(el("td",null,""));
    ftr.appendChild(el("td",null,""));
    var grandTd=el("td","num sumval");
    ftr.appendChild(grandTd);
    tf.appendChild(ftr);
    table.appendChild(tf);

    function recomputeGrand(){
      var sum=0;
      rowRefs.forEach(function(r){ sum+=r.payOf(); });
      grandTd.textContent=fmtWon(sum);
    }
    recomputeGrand();

    wrap.appendChild(table);
    card.appendChild(wrap);
    app.appendChild(card);
    app.appendChild(el("p","note","시급을 적으면 근무 시간과 곱한 금액에서 3.3% 세금(사업소득세)을 뗀 금액이 월급으로 표시됩니다. 주휴수당은 포함되지 않은 단순 계산입니다."));
  }

        state.adminUnlocked=true;
        render(true);
      }else{
        msg.textContent="비밀번호가 올바르지 않습니다.";
        msg.className="status warn";
        pwI.value="";
        pwI.focus();
      }
    }
    btn.addEventListener("click", tryEnter);
    pwI.addEventListener("keydown", function(e){ if(e.key==="Enter") tryEnter(); });

    card.appendChild(pad);
    app.appendChild(card);
  }

    confirmI.type="password"; confirmI.className="ti"; confirmI.inputMode="numeric";
    confirmI.maxLength=5; confirmI.autocomplete="off"; confirmI.placeholder="숫자 5자리";

      if(!/^[0-9]{5}$/.test(a)){
        msg.textContent="비밀번호는 숫자 5자리로 입력해 주세요.";
        msg.className="status warn";
        return;
      }
      if(a===state.adminPassword){
        msg.textContent="이전 비밀번호와 같습니다. 다른 비밀번호로 입력해 주세요.";
        msg.className="status warn";
        return;
      }
      if(a!==b){
        msg.textContent="입력하신 두 비밀번호가 서로 다릅니다. 다시 확인해 주세요.";
        msg.className="status warn";
        confirmI.value="";
        confirmI.focus();

      }
      state.adminPassword=a;

      msg.className="status success";

    pad.appendChild(msg);

    card.appendChild(pad);
    app.appendChild(card);

  function currentBackupPayload(){
    return {
      kind: "shift-log-backup",
      savedAt: new Date().toISOString(),
      employees: state.employees,
      data: state.data,
      handover: state.handover,
      schedule: state.schedule,
      coffeeFrontFirst: state.coffeeFrontFirst,
      posts: state.posts,
      checklist: state.checklist,
      prepayCustomers: state.prepayCustomers,
      prepayVisits: state.prepayVisits,
      prepayAmtCustomers: state.prepayAmtCustomers,
      prepayAmtVisits: state.prepayAmtVisits,
      adminPassword: state.adminPassword,
      removedIds: Array.from(removedIds)
    };
  }

  function restoreFromBackup(payload){
    if(!payload || typeof payload!=="object") throw new Error("형식이 올바르지 않습니다.");
    state.employees = Array.isArray(payload.employees) ? payload.employees : [];
    state.data = (payload.data && typeof payload.data==="object") ? payload.data : {};
    state.handover = (payload.handover && typeof payload.handover==="object") ? payload.handover : {};
    state.schedule = (payload.schedule && typeof payload.schedule==="object") ? payload.schedule : {};
    state.posts = Array.isArray(payload.posts) ? payload.posts : [];
    state.checklist = (payload.checklist && typeof payload.checklist==="object") ? payload.checklist : {};
    state.prepayCustomers = Array.isArray(payload.prepayCustomers) ? payload.prepayCustomers : [];
    state.prepayVisits = (payload.prepayVisits && typeof payload.prepayVisits==="object") ? payload.prepayVisits : {};
    state.prepayAmtCustomers = Array.isArray(payload.prepayAmtCustomers) ? payload.prepayAmtCustomers : [];
    state.prepayAmtVisits = (payload.prepayAmtVisits && typeof payload.prepayAmtVisits==="object") ? payload.prepayAmtVisits : {};
    if(typeof payload.coffeeFrontFirst==="boolean") state.coffeeFrontFirst=payload.coffeeFrontFirst;
    if(typeof payload.adminPassword==="string" && payload.adminPassword) state.adminPassword=payload.adminPassword;
    removedIds = new Set(Array.isArray(payload.removedIds)? payload.removedIds : []);
    persistRemovedIds();
    applyRemovedOverride();

    saveEmployees();
    saveAdminPassword();
    saveCoffeeSetting();
    savePosts();
    saveChecklist();
    savePrepayCustomers();
    Object.keys(state.prepayVisits).forEach(function(custId){ savePrepayVisitsFor(custId); });
    savePrepayAmtCustomers();
    Object.keys(state.prepayAmtVisits).forEach(function(custId){ savePrepayAmtVisitsFor(custId); });
    var jobs=[];
    Object.keys(state.data).forEach(function(ym){
      Object.keys(state.data[ym]||{}).forEach(function(id){ jobs.push(saveMonth(ym,id)); });
    });
    Object.keys(state.handover).forEach(function(ym){ jobs.push(saveHandover(ym)); });
    Object.keys(state.schedule).forEach(function(weekStart){ jobs.push(saveSchedule(weekStart)); });
    return Promise.all(jobs);
  }

  function appendBackupSection(app){
    var card=el("div","card");
    var head=el("div","card-head");
    head.appendChild(el("div","h","데이터 백업"));
    card.appendChild(head);
    var pad=el("div","pad");
    pad.appendChild(el("p","lede","기기를 바꾸거나, 브라우저 데이터가 지워질 수 있는 상황(시크릿 모드, 인터넷 사용 기록 삭제 등) 전에 백업 파일로 저장해 두면 나중에 그대로 불러올 수 있습니다."));

    var line=el("div","field");
    var exportBtn=el("button","btn ghost","백업 파일로 저장"); exportBtn.type="button";
    var importBtn=el("button","btn ghost","백업 파일 불러오기"); importBtn.type="button";
    var fileInput=document.createElement("input");
    fileInput.type="file"; fileInput.accept="application/json,.json";
    fileInput.style.display="none";
    line.appendChild(exportBtn); line.appendChild(importBtn); line.appendChild(fileInput);
    pad.appendChild(line);

    var msg=el("p","status","");
    pad.appendChild(msg);

    exportBtn.addEventListener("click", function(){
      var json=JSON.stringify(currentBackupPayload(), null, 2);
      var filename="근무기록-백업-"+todayStr()+".json";
      function fallbackDownload(){
        try{
          var blob=new Blob([json], { type:"application/json" });
          var url=URL.createObjectURL(blob);
          var a=document.createElement("a");
          a.href=url; a.download=filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          msg.textContent="백업 파일을 저장했습니다.";
          msg.className="status success";
        }catch(e){
          msg.textContent="백업 파일을 저장하지 못했습니다.";
          msg.className="status warn";
        }
      }
      if(window.claude && typeof window.claude.use==="function"){
        window.claude.use("downloads").then(function(dl){
          if(!dl){ fallbackDownload(); return; }
          return dl.save({ filename:filename, data:json }).then(function(){
            msg.textContent="백업 파일을 저장했습니다.";
            msg.className="status success";
          }).catch(function(){
            msg.textContent="백업 파일 저장이 취소되었거나 실패했습니다.";
            msg.className="status warn";
          });
        }).catch(fallbackDownload);
      }else{
        fallbackDownload();
      }
    });

    importBtn.addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      var file=fileInput.files && fileInput.files[0];
      fileInput.value="";
      if(!file) return;
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var payload=JSON.parse(reader.result);
          restoreFromBackup(payload).then(function(){
            msg.textContent="백업 파일을 불러왔습니다.";
            msg.className="status success";
          });
        }catch(e){
          msg.textContent="이 파일을 읽을 수 없습니다. 이 프로그램에서 저장한 백업 파일인지 확인해 주세요.";
          msg.className="status warn";
        }
      };
      reader.readAsText(file);
    });

    card.appendChild(pad);
    app.appendChild(card);
  }

  function renderResetCard(app){
    var card=el("div","card");
    var pad=el("div","pad");

    pad.appendChild(el("div","empty",
      "근무자, 출퇴근 기록, 인수인계, 근무표, 게시판/공지사항, 관리자 비밀번호까지 모든 기록이 지워지고 처음 상태로 되돌아갑니다. 되돌릴 수 없으니 꼭 필요할 때만 사용해 주세요."));

    var f=el("div","field");
    f.style.marginTop="14px";
    f.appendChild(el("label",null,"확인을 위해 \"초기화\"라고 입력해 주세요"));
    var confirmI=document.createElement("input");
    confirmI.type="text"; confirmI.className="ti"; confirmI.style.flex="1";
    confirmI.placeholder="초기화";
    f.appendChild(confirmI);
    pad.appendChild(f);

    var msg=el("p","status","");
    var goBtn=el("button","btn danger","전체 초기화"); goBtn.type="button";
    goBtn.style.marginTop="10px";
    goBtn.disabled=true;
    confirmI.addEventListener("input", function(){
      goBtn.disabled = (confirmI.value.trim()!=="초기화");
    });
    goBtn.addEventListener("click", function(){
      if(confirmI.value.trim()!=="초기화") return;
      goBtn.disabled=true;
      msg.textContent="초기화하는 중입니다...";
      msg.className="status";
      var localWipe=function(){
        try{ localStorage.removeItem(LS_KEY); }catch(e){}
        try{ localStorage.removeItem(REMOVED_KEY); }catch(e){}
        try{ localStorage.removeItem(RECENT_REMOVED_KEY); }catch(e){}
      };
      var remoteWipe = (db && db.wipeAll) ? db.wipeAll() : Promise.resolve();
      remoteWipe.then(function(){
        localWipe();
        state.employees=[];
        state.data={};
        state.handover={};
        state.schedule={};
        state.posts=[];
        state.checklist={};
        state.prepayCustomers=[];
        state.prepayVisits={};
        state.prepayAmtCustomers=[];
        state.prepayAmtVisits={};
        state.coffeeFrontFirst=true;
        state.adminPassword="12345";
        removedIds=new Set();
        var jobs=[ saveEmployees(), saveAdminPassword(), saveCoffeeSetting(), savePosts(), saveChecklist(),
          savePrepayCustomers(), savePrepayAmtCustomers() ];
        return Promise.all(jobs);
      }).then(function(){
        msg.textContent="초기화되었습니다. 비밀번호도 12345로 초기화되었습니다.";
        msg.className="status success";
        confirmI.value="";
      }).catch(function(e){
        console.error(e);
        localWipe();
        msg.textContent="초기화 중 일부 오류가 있었습니다. 새로고침 후 다시 확인해 주세요.";
        msg.className="status warn";
        goBtn.disabled=false;
      });
    });
    pad.appendChild(goBtn);
    pad.appendChild(msg);

    card.appendChild(pad);
    app.appendChild(card);
  }

  /* ===================== render ===================== */
  function isEditing(){
    var a=document.activeElement;
    return a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA") && a.id!=="wage" && a.closest("#app");
  }
  var pending=false;
  function render(force){
    if(!force && isEditing()){ pending=true; return; }
    pending=false;
    var app=document.getElementById("app");
    app.textContent="";
    var v=state.view;
    if(v==="home") viewHome(app);
    else if(v==="store") viewStore(app);
    else if(v==="clock") viewClock(app);
    else if(v==="overall") viewOverall(app);
    else if(v==="people") viewPeople(app);
    else if(v==="person") viewPerson(app);
    else if(v==="add") viewAdd(app);
    else if(v==="handover") viewHandover(app);
    else if(v==="board") viewBoard(app);
    else if(v==="checklist") viewChecklist(app);
    else if(v==="prepay") viewPrepay(app);
    else if(v==="prepaydetail") viewPrepayDetail(app);
    else if(v==="prepayamtdetail") viewPrepayAmtDetail(app);
    else if(v==="schedule") viewSchedule(app);
    else if(v==="admin") viewAdmin(app);
    var s=el("p","status"); s.id="statusLine";
    app.appendChild(s);
    document.title=(VIEWS[v]?VIEWS[v].title:"창릉 프리미어")+" — 창릉 프리미어";
  }
  function flushPending(){
    if(pending && !isEditing()) render();
  }
  document.addEventListener("focusout", function(){ setTimeout(flushPending, 0); });
  document.addEventListener("pointerdown", function(e){
    if(pending && document.activeElement && e.target!==document.activeElement){ flushPending(); }
  }, true);

  /* ===================== boot ===================== */
  loadLocal();
  render();

  (window.__dbReady || Promise.reject(new Error("no loader"))).then(function(dbAdapter){
    db=dbAdapter;
    var localEmp=state.employees.slice();
    var localData=state.data;
    var localHandover=state.handover;
    var localSchedule=state.schedule;
    var localAdminPw=state.adminPassword;
    var localPosts=state.posts.slice();
    db.doc("config/employees").get().then(function(snap){
      var has=snap.exists && (snap.data().list||[]).length>0;
      if(!has && localEmp.length){
        state.employees=localEmp;
        return saveEmployees().then(function(){
          var jobs=[];
          Object.keys(localData).forEach(function(ym){
            Object.keys(localData[ym]||{}).forEach(function(id){
              setRows(ym,id,localData[ym][id]);
              jobs.push(saveMonth(ym,id));
            });
          });
          Object.keys(localHandover).forEach(function(ym){
            setHandoverRows(ym, localHandover[ym]);
            jobs.push(saveHandover(ym));
          });
          Object.keys(localSchedule).forEach(function(weekStart){
            state.schedule[weekStart]=localSchedule[weekStart];
            jobs.push(saveSchedule(weekStart));
          });
          if(localAdminPw && localAdminPw!=="12345"){
            state.adminPassword=localAdminPw;
            jobs.push(saveAdminPassword());
          }
          if(localPosts.length){
            state.posts=localPosts;
            jobs.push(savePosts());
          }
          return Promise.all(jobs);
        });
      }
    }).catch(function(){}).then(function(){
      subYm=null; subscribe(state.ym);
    });
  }).catch(function(){
    setStatus("실시간 동기화(Supabase)를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요. (계속 이러면 회사/공용 네트워크가 연결을 막고 있을 수 있습니다)", true);
  });
})();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
